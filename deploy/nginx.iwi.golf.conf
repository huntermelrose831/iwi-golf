server {
    listen 80;
    server_name iwi.golf www.iwi.golf;

    root /var/www/iwi-golf/dist;
    index index.html;

    # Security headers (CSP allows Stripe's embedded Payment Element; see deploy/security-headers.conf).
    include /etc/nginx/snippets/security-headers.conf;

    # Reverse proxy to the Node/Express server (pm2, listening on 4242).
    location /api/ {
        proxy_pass http://127.0.0.1:4242;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Internal check used by auth_request below; forwards the visitor's cookie to the
    # Express server so it can validate the password-only site gate (see server/index.js).
    location = /_gate_check {
        internal;
        proxy_pass http://127.0.0.1:4242/api/gate/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # Unauthenticated visitors land here instead of a 401 page.
    location @gate_redirect {
        return 302 /gate.html?redirect=$request_uri;
    }

    # Password-only gate page and its script; served directly so they don't trigger auth_request.
    location ~ ^/gate\.(html|js)$ {
        try_files $uri =404;
    }

    # SPA fallback so client-side routes (e.g. /order) don't 404 on refresh.
    location / {
        auth_request /_gate_check;
        error_page 401 = @gate_redirect;
        try_files $uri /index.html;
    }
}
